name: Build and Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local-helper/requirements.txt pyinstaller

      - name: Generate application icon
        working-directory: local-helper
        run: python generate_icon.py

      - name: Download FFmpeg essentials
        working-directory: local-helper
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path ffmpeg
          Write-Host "Downloading FFmpeg release essentials..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "ffmpeg/ffmpeg.exe"
          Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Copy-Item -Destination "ffmpeg/ffprobe.exe"
          Remove-Item -Path "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force
          Write-Host "FFmpeg prepared:"
          Get-ChildItem -Path ffmpeg

      - name: Build with PyInstaller
        working-directory: local-helper
        run: python build.py

      - name: Verify bundled binaries
        run: |
          if (-not (Test-Path "local-helper/dist/InstaGrab Helper/ffmpeg/ffmpeg.exe")) {
            throw "FFmpeg binary missing from dist directory!"
          }
          if (-not (Test-Path "local-helper/dist/InstaGrab Helper/ffmpeg/ffprobe.exe")) {
            throw "FFprobe binary missing from dist directory!"
          }
          Write-Host "Verified all required media dependencies bundled successfully in dist/InstaGrab Helper/ffmpeg/"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" local-helper/installer/setup.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: InstaGrab Helper ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            local-helper/dist/InstaGrab-Helper-Setup*.exe
            frontend/public/instagrab-extension.zip
