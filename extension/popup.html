<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>InstaGrab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* THEME SYSTEM (7 Fresh Optimized Themes) */
    body.creators {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      --btn-primary-bg: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      --btn-primary-text: #ffffff;
      --btn-primary-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      --status-bg: #eff6ff;
      --status-text: #1d4ed8;
      --status-border: #bfdbfe;
    }

    body.dark {
      --bg-body: #0b0f19;
      --bg-card: #131b2e;
      --bg-input: #1a233b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #1e293b;
      --accent-color: #38bdf8;
      --btn-primary-bg: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      --btn-primary-text: #041324;
      --btn-primary-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      --status-bg: rgba(56, 189, 248, 0.1);
      --status-text: #7dd3fc;
      --status-border: rgba(56, 189, 248, 0.25);
    }

    body.light {
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --bg-input: #f3f4f6;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border-color: #e5e7eb;
      --accent-color: #4f46e5;
      --btn-primary-bg: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --btn-primary-text: #ffffff;
      --btn-primary-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      --status-bg: #eef2ff;
      --status-text: #3730a3;
      --status-border: #c7d2fe;
    }

    body.cyberpunk {
      --bg-body: #070a14;
      --bg-card: #0f1526;
      --bg-input: #161e36;
      --text-primary: #22d3ee;
      --text-secondary: #94a3b8;
      --border-color: #1e293b;
      --accent-color: #06b6d4;
      --btn-primary-bg: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
      --btn-primary-text: #ffffff;
      --btn-primary-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
      --status-bg: rgba(6, 182, 212, 0.12);
      --status-text: #67e8f9;
      --status-border: rgba(6, 182, 212, 0.3);
    }

    body.sunset {
      --bg-body: #140d12;
      --bg-card: #20141d;
      --bg-input: #2b1a27;
      --text-primary: #ffedd5;
      --text-secondary: #f472b6;
      --border-color: #3d1a33;
      --accent-color: #f43f5e;
      --btn-primary-bg: linear-gradient(135deg, #f59e0b 0%, #f43f5e 100%);
      --btn-primary-text: #ffffff;
      --btn-primary-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
      --status-bg: rgba(245, 158, 11, 0.12);
      --status-text: #fcd34d;
      --status-border: rgba(245, 158, 11, 0.3);
    }

    body.oled {
      --bg-body: #000000;
      --bg-card: #0d0d0d;
      --bg-input: #171717;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --border-color: #27272a;
      --accent-color: #ffffff;
      --btn-primary-bg: #ffffff;
      --btn-primary-text: #000000;
      --btn-primary-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
      --status-bg: rgba(255, 255, 255, 0.08);
      --status-text: #ffffff;
      --status-border: rgba(255, 255, 255, 0.2);
    }

    body.emerald {
      --bg-body: #060f0a;
      --bg-card: #0d1a12;
      --bg-input: #12241a;
      --text-primary: #ecfdf5;
      --text-secondary: #6ee7b7;
      --border-color: #132e1f;
      --accent-color: #10b981;
      --btn-primary-bg: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-primary-text: #022c16;
      --btn-primary-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      --status-bg: rgba(16, 185, 129, 0.12);
      --status-text: #a7f3d0;
      --status-border: rgba(16, 185, 129, 0.28);
    }

    body {
      width: 330px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-body, #0b0f19);
      color: var(--text-primary, #f8fafc);
      transition: background 0.2s, color 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--btn-primary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--btn-primary-shadow);
      flex-shrink: 0;
    }

    .logo svg {
      width: 18px;
      height: 18px;
      stroke: var(--btn-primary-text);
      stroke-width: 2.2;
      fill: none;
    }

    .title h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.1;
      color: var(--text-primary);
    }

    .title p {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    /* 7-Theme Switcher Dots */
    .theme-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 6px;
      background: var(--bg-input);
      border-radius: 999px;
      border: 1px solid var(--border-color);
    }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .theme-dot:hover {
      transform: scale(1.35);
    }

    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 11px;
      margin-bottom: 12px;
      font-size: 11.5px;
      font-weight: 500;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--status-bg);
      color: var(--status-text);
      border: 1px solid var(--status-border);
      padding: 2.5px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.2s;
    }

    .dot.connected {
      background: var(--accent-color);
      box-shadow: 0 0 6px var(--accent-color);
    }

    .detected-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-color);
      background: var(--status-bg);
      border: 1px solid var(--status-border);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .input-box {
      margin-bottom: 10px;
      position: relative;
    }

    .input-box input {
      width: 100%;
      padding: 8.5px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 11.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .options-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .format-pills {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 2.5px;
      flex: 1;
    }

    .format-pill {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 0;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .format-pill.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .quality-select {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 9px;
      outline: none;
      cursor: pointer;
      min-width: 95px;
    }

    .quality-select:focus {
      border-color: var(--accent-color);
    }

    .btn-grab {
      width: 100%;
      padding: 10px;
      border-radius: 11px;
      border: none;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      box-shadow: var(--btn-primary-shadow);
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn-grab:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .btn-grab:active {
      transform: translateY(1px);
    }

    .btn-grab:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-grab svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
    }

    /* Live Progress Card */
    .progress-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: none;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--bg-input);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--btn-primary-bg);
      transition: width 0.25s ease;
      border-radius: 999px;
    }

    .progress-detail {
      font-size: 10px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
      display: none;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .links {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .links a {
      font-size: 11px;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* Banner Ad in Extension Popup */
    .popup-banner-ad {
      margin-top: 12px;
      padding: 7px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      position: relative;
    }

    .popup-banner-ad .ad-tag {
      font-size: 8px;
      font-weight: 700;
      color: var(--text-secondary);
      opacity: 0.7;
      letter-spacing: 0.6px;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .popup-banner-ad .ad-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popup-banner-ad .ad-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--status-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .popup-banner-ad .ad-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent-color);
      fill: none;
      stroke-width: 2;
    }

    .popup-banner-ad .ad-info {
      flex: 1;
      min-width: 0;
    }

    .popup-banner-ad .ad-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-banner-ad .ad-desc {
      font-size: 9.5px;
      color: var(--text-secondary);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-banner-ad .ad-cta {
      padding: 3px 8px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      text-decoration: none;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .popup-banner-ad .ad-cta:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body class="creators">
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M12 12v9" /><path d="m8 17 4 4 4-4" /></svg>
      </div>
      <div class="title">
        <h1>InstaGrab</h1>
        <p>Universal Media Downloader</p>
      </div>
    </div>

    <!-- 7-Theme Quick Selector -->
    <div class="theme-bar" title="Switch Theme">
      <div class="theme-dot" data-theme="creators" style="background: #2563eb;" title="Creators Blue"></div>
      <div class="theme-dot" data-theme="dark" style="background: #38bdf8;" title="Midnight Studio"></div>
      <div class="theme-dot" data-theme="light" style="background: #4f46e5;" title="Minimal Light"></div>
      <div class="theme-dot" data-theme="cyberpunk" style="background: #06b6d4;" title="Cyberpunk Neon"></div>
      <div class="theme-dot" data-theme="sunset" style="background: #f43f5e;" title="Sunset Amber"></div>
      <div class="theme-dot" data-theme="oled" style="background: #ffffff;" title="OLED Midnight"></div>
      <div class="theme-dot" data-theme="emerald" style="background: #10b981;" title="Emerald Obsidian"></div>
    </div>
  </div>

  <div class="status-card">
    <span style="opacity: 0.85;">Desktop Engine:</span>
    <div class="status-badge">
      <div id="dot" class="dot"></div>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <div id="detected-pill" class="detected-pill" style="display: none;"></div>

  <div class="input-box">
    <input type="text" id="url-input" placeholder="Paste link (IG, YouTube, Pinterest, Envato, Epidemic)..." />
  </div>

  <!-- Format & Quality Selection Controls -->
  <div class="options-row">
    <div class="format-pills">
      <button type="button" class="format-pill active" id="btn-video" data-format="video">🎬 Video</button>
      <button type="button" class="format-pill" id="btn-audio" data-format="audio">🎵 Audio</button>
    </div>
    <select id="quality-select" class="quality-select">
      <option value="best">Best Quality</option>
      <option value="1080p">1080p</option>
      <option value="720p">720p</option>
      <option value="480p">480p</option>
    </select>
  </div>

  <button id="download-btn" class="btn-grab">
    <svg viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M12 12v9" /><path d="m8 17 4 4 4-4" /></svg>
    <span id="btn-text">Download to Browser</span>
  </button>

  <!-- Live In-Popup Progress Bar -->
  <div id="progress-box" class="progress-box">
    <div class="progress-header">
      <span id="prog-state">Downloading...</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-track">
      <div id="prog-fill" class="progress-fill"></div>
    </div>
    <div class="progress-detail">
      <span id="prog-speed">Connecting to engine...</span>
      <span id="prog-eta"></span>
    </div>
  </div>

  <div id="msg"></div>

  <!-- Extension Banner Ad -->
  <div class="popup-banner-ad">
    <div class="ad-tag">ADVERTISEMENT</div>
    <div class="ad-content">
      <div class="ad-icon">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </div>
      <div class="ad-info">
        <span class="ad-title">InstaGrab Desktop Helper</span>
        <span class="ad-desc">Lossless 4K 60fps &amp; batch downloads</span>
      </div>
      <a href="https://akashbenniamin.github.io/InstaGrab/" target="_blank" class="ad-cta">Get</a>
    </div>
  </div>

  <div class="links">
    <a href="https://akashbenniamin.github.io/InstaGrab/" target="_blank" id="open-web">Open Full Web App</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
